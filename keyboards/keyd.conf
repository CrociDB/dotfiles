[ids]
*

[main]
capslock = overload(layer1, escape)
rightcontrol = overload(layer2, rightcontrol)

[layer1]
h = left
j = down
k = up
l = right
b = macro(leftcontrol+left)
w = macro(leftcontrol+right)
u = macro(leftcontrol+z)
4 = home
6 = end

[layer2]
leftshift = middlemouse
rightshift = middlemouse
up = volumeup
down = volumedown
right = brightnessup
left = brightnessdown
