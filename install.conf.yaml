- defaults:
    link:
      relink: true
      create: true

- link:
    ~/.tmux.conf: tmux/tmux.conf
    ~/.config/ghostty/config: ghostty/config
    ~/.config/ghostty/shaders: ghostty/shaders
    ~/.config/doom: doom-emacs
    ~/.config/nvim/lua: nvim
    ~/.config/foot/foot.ini: foot/foot.ini

- shell:
    - sudo ln -sf $HOME/.dotfiles/keyboards/keyd.conf /etc/keyd/default.conf && sudo keyd reload
